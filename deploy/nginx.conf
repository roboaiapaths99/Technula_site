# Nginx Configuration for Technula Website & API
# Server: VPS Ubuntu/Debian

server {
    listen 80;
    listen [::]:80;
    server_name technula.com www.technula.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name technula.com www.technula.com;

    # SSL Certificates (Certbot managed)
    ssl_certificate /etc/letsencrypt/live/technula.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technula.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Frontend Single Page App (Vite Build output in client/dist)
    root /root/technula/Technula_site/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache Control
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Backend API Reverse Proxy (Express running on port 5005)
    location /api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Express Health Check
    location /health {
        proxy_pass http://127.0.0.1:5005/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Custom 404 page
    error_page 404 /index.html;
}
